<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b18"/>
      <stop offset="100%" stop-color="#161310"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4896e"/>
      <stop offset="100%" stop-color="#b86e54"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Moon crescent — scaled down 20% for safe zone -->
  <circle cx="240" cy="244" r="96" fill="url(#moon)"/>
  <circle cx="288" cy="208" r="84" fill="url(#bg)"/>
  <!-- Stars — gold -->
  <circle cx="182" cy="172" r="5.5" fill="#c49533" opacity="0.95"/>
  <circle cx="162" cy="224" r="3.5" fill="#c49533" opacity="0.65"/>
  <circle cx="208" cy="144" r="4.5" fill="#c49533" opacity="0.8"/>
</svg>
